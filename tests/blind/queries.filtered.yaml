# Filtered search queries for tests/corpus/.
#
# This fixture checks that folder and source-tag filters act as retrieval scopes,
# not just presentation filters. It is intentionally small and public-safe; larger
# scale/filter stress runs belong in .scratch/.

- query: "why keyword search still helps embeddings"
  intent: "retrieve the BM25 note inside the retrieval tag scope"
  expected_paths:
    - "notes/bm25-intuition.md"
  answer_contains:
    "notes/bm25-intuition.md": "Vector embedders are strong"
  tags: [filtered, tag-filter, english, retrieval]
  filters:
    tags: [bm25]

- query: "how agents remember between sessions"
  intent: "retrieve the agent memory note inside the agents+memory tag scope"
  expected_paths:
    - "notes/agent-memory-patterns.md"
  answer_contains:
    "notes/agent-memory-patterns.md": "LLMs are stateless"
  tags: [filtered, tag-filter, english, agents]
  filters:
    tags: [agents, memory]

- query: "记忆为什么在睡眠中稳定下来"
  intent: "retrieve memory consolidation through Chinese semantic phrasing"
  expected_paths:
    - "notes/memory-consolidation.md"
  answer_contains:
    "notes/memory-consolidation.md": "睡眠剥夺直接降低"
  tags: [filtered, tag-filter, cjk, memory]
  filters:
    tags: [memory, sleep]

- query: "turn durable notes into review cards"
  intent: "retrieve the note-to-card workflow inside notes/"
  expected_paths:
    - "notes/note-to-card-workflow.md"
  answer_contains:
    "notes/note-to-card-workflow.md": "review-worthy claims"
  tags: [filtered, folder-filter, english, workflow]
  filters:
    folder: "notes"

